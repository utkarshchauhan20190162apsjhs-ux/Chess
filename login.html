<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Login Page</title>\n    <style>\n        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }\n        .container { width: 300px; margin: 100px auto; padding: 20px; background: #fff; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }\n        h2 { text-align: center; }\n        input[type='text'], input[type='email'], input[type='password'] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }\n        input[type='submit'] { width: 100%; padding: 10px; color: #fff; background: #007bff; border: none; border-radius: 5px; cursor: pointer; }\n        input[type='submit']:hover { background: #0056b3; }\n    </style>\n</head>\n<body>\n    <div class="container">\n        <h2>Login</h2>\n        <form action="#" onsubmit="return handleSubmit(event)">\n            <input type="email" id="email" placeholder="Enter your email" required>\n            <input type="password" id="password" placeholder="Enter your password" required>\n            <input type="submit" value="Login">\n        </form>\n    </div>\n    <script>\n        function handleSubmit(event) {\n            event.preventDefault();\n            const email = document.getElementById('email').value;\n            const password = document.getElementById('password').value;\n            // Perform authentication (this is a placeholder)\n            alert('Email: ' + email + '\\nPassword: ' + password);\n            // Here you would typically send this data to a server using fetch or similar methods.\n            return false; // Prevent actual submission for this demo\n        }\n    </script>\n</body>\n</html>
