<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <script>
        function validateForm() {
            let name = document.forms["registrationForm"]["name"].value;
            let email = document.forms["registrationForm"]["email"].value;
            let password = document.forms["registrationForm"]["password"].value;
            if (name == "" || email == "" || password == "") {
                alert("All fields must be filled out.");
                return false;
            }
            return true;
        }

        function submitForm(event) {
            event.preventDefault(); // Prevent form submission
            
            if (!validateForm()) return;

            const formData = new FormData(event.target);
            fetch('/your-backend-endpoint', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
                alert('Registration successful!'); // Display success message
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('Registration failed!'); // Display error message
            });
        }
    </script>
</head>
<body>
    <h2>Registration Form</h2>
    <form name="registrationForm" onsubmit="submitForm(event)">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
